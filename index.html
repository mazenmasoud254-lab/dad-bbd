<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Dad's Birthday Board</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f9e8b4 0%, #f4d03f 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .birthday-header {
            text-align: center;
            margin-bottom: 2rem;
            animation: pop 1s ease;
        }

        .birthday-header h1 {
            font-size: 3.5rem;
            color: #b22234;
            text-shadow: 4px 4px 0 #ffd966, 6px 6px 0 rgba(0,0,0,0.2);
            letter-spacing: 2px;
            word-break: break-word;
        }

        .birthday-header h1 i {
            color: #ffb347;
            margin: 0 8px;
        }

        .birthday-header p {
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 0.4rem 2rem;
            border-radius: 60px;
            color: #7b3f00;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        /* form card */
        .form-card {
            background: rgba(255, 248, 225, 0.85);
            backdrop-filter: blur(6px);
            padding: 2rem 2rem 1.8rem;
            border-radius: 70px 70px 40px 40px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), 0 0 0 6px #ffd966, 0 0 0 10px #fff3c9;
            max-width: 750px;
            width: 100%;
            margin-bottom: 2.8rem;
            transition: 0.25s;
        }

        .form-card:hover {
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25), 0 0 0 6px #f1c40f, 0 0 0 10px #fef9e0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
        }

        .input-row label {
            font-weight: 700;
            color: #5d3a1a;
            font-size: 1.2rem;
            min-width: 70px;
        }

        .input-row input, .input-row textarea {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border: 2px solid #f7b731;
            border-radius: 60px;
            background: #fffcf0;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
        }

        .input-row input:focus, .input-row textarea:focus {
            border-color: #b7950b;
            background: #fffffa;
            box-shadow: 0 0 0 4px #f9e79f;
        }

        .input-row textarea {
            border-radius: 30px;
            resize: vertical;
            min-height: 70px;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            background: #fcf3db;
            padding: 0.4rem 1rem 0.4rem 1.8rem;
            border-radius: 60px;
            border: 2px dashed #c9a84b;
        }

        .file-upload-wrapper i {
            font-size: 1.5rem;
            color: #a67c2b;
        }

        .file-upload-wrapper input[type="file"] {
            border: none;
            padding: 0.4rem 0;
            background: transparent;
            flex: 1;
            font-size: 0.95rem;
        }

        .file-upload-wrapper input[type="file"]::file-selector-button {
            background: #f1c40f;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            color: #2c1f0c;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .file-upload-wrapper input[type="file"]::file-selector-button:hover {
            background: #d4ac0d;
            transform: scale(0.96);
        }

        .action-btn {
            background: #d4a017;
            border: none;
            color: #2d1d0a;
            font-weight: 700;
            font-size: 1.5rem;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 0 #8b6914, 0 6px 16px rgba(0,0,0,0.2);
            transition: all 0.07s ease;
            margin-top: 0.5rem;
            width: 100%;
            letter-spacing: 1px;
        }

        .action-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #6b4f0e;
        }

        .action-btn i {
            font-size: 1.8rem;
        }

        /* message grid */
        .messages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            width: 100%;
            margin-top: 1rem;
        }

        .message-card {
            background: #fff9ec;
            border-radius: 50px 20px 50px 20px;
            padding: 1.6rem 1.2rem 1.5rem;
            box-shadow: 0 16px 30px -6px rgba(0, 0, 0, 0.2), 0 0 0 4px #f7dc6f, 0 0 0 8px #fef9e7;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            position: relative;
            transform: rotate(0.5deg);
        }

        .message-card:nth-child(odd) {
            transform: rotate(-0.8deg);
        }

        .message-card:hover {
            transform: scale(1.02) rotate(0deg);
            box-shadow: 0 24px 40px -8px #a67c2b;
        }

        .card-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 30px 10px 30px 10px;
            border: 6px solid #ffe28c;
            background: #f7e3b6;
            margin-bottom: 1rem;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .card-image-placeholder {
            width: 100%;
            aspect-ratio: 4/3;
            background: repeating-linear-gradient(45deg, #f7dcb0, #f7dcb0 10px, #faeac8 10px, #faeac8 20px);
            border-radius: 30px 10px 30px 10px;
            border: 6px dashed #dbb15d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b6f34;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
            padding: 1rem;
        }

        .card-image-placeholder i {
            font-size: 2.8rem;
            margin-right: 8px;
            color: #b8862c;
        }

        .message-text {
            font-size: 1.25rem;
            background: #fdf3d6;
            padding: 0.8rem 1.2rem;
            border-radius: 60px 20px 60px 20px;
            width: 100%;
            word-break: break-word;
            color: #3d2b0f;
            box-shadow: inset 0 2px 8px rgba(93, 61, 18, 0.08);
            border: 2px solid #f3d37c;
            margin-bottom: 0.6rem;
            font-weight: 500;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #b34141;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 0.3rem;
            align-self: flex-end;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            background: #ffebd6;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .delete-btn:hover {
            background: #f7c0b0;
            color: #8f1f1f;
            transform: scale(0.9);
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2.2rem;
            color: #4e3a1a;
            background: rgba(255, 241, 179, 0.5);
            padding: 2.5rem;
            border-radius: 120px;
            backdrop-filter: blur(4px);
            font-weight: 600;
            border: 4px dashed #e6b422;
        }

        .empty-message i {
            margin-right: 12px;
            color: #c9921a;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 550px) {
            .birthday-header h1 { font-size: 2.5rem; }
            .form-card { padding: 1.5rem; }
            .input-row { flex-direction: column; align-items: stretch; }
            .file-upload-wrapper { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="birthday-header">
    <h1><i class="fas fa-birthday-cake"></i> Happy Birthday Dad! <i class="fas fa-balloons"></i></h1>
    <p><i class="fas fa-heart" style="color: #c0392b;"></i>  add a message + photo  <i class="fas fa-camera"></i></p>
</div>

<!-- form -->
<div class="form-card">
    <div class="input-group">
        <div class="input-row">
            <label for="messageInput"><i class="fas fa-pencil-alt"></i> Message</label>
            <textarea id="messageInput" placeholder="Write something special for Dad..."></textarea>
        </div>
        <div class="input-row">
            <label for="imageInput"><i class="fas fa-image"></i> Photo</label>
            <div class="file-upload-wrapper">
                <i class="fas fa-cloud-upload-alt"></i>
                <input type="file" id="imageInput" accept="image/*">
            </div>
        </div>
        <button class="action-btn" id="addMessageBtn"><i class="fas fa-gift"></i> Add to Board</button>
    </div>
</div>

<!-- message grid -->
<div id="messagesContainer" class="messages-grid">
    <!-- cards will be injected here -->
    <div class="empty-message"><i class="fas fa-glass-cheers"></i> No memories yet — add one above!</div>
</div>

<script>
    (function() {
        // === DOM refs ===
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const imageInput = document.getElementById('imageInput');
        const addBtn = document.getElementById('addMessageBtn');

        // === load from localStorage ===
        let messages = [];

        function loadFromStorage() {
            try {
                const stored = localStorage.getItem('dadBirthdayMessages');
                if (stored) {
                    messages = JSON.parse(stored);
                } else {
                    messages = [];
                }
            } catch (e) {
                messages = [];
            }
            // ensure each message has a text & imageDataUrl (may be null)
            messages = messages.filter(m => m && typeof m.text === 'string');
        }

        function saveToStorage() {
            localStorage.setItem('dadBirthdayMessages', JSON.stringify(messages));
        }

        // === render all messages ===
        function renderMessages() {
            if (!messagesContainer) return;

            // clear container
            messagesContainer.innerHTML = '';

            if (messages.length === 0) {
                // show empty state
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.innerHTML = `<i class="fas fa-glass-cheers"></i> No memories yet — add one above!`;
                messagesContainer.appendChild(emptyDiv);
                return;
            }

            // build cards
            messages.forEach((msg, index) => {
                const card = document.createElement('div');
                card.className = 'message-card';

                // image part
                if (msg.imageDataUrl && msg.imageDataUrl.trim() !== '') {
                    const img = document.createElement('img');
                    img.className = 'card-image';
                    img.src = msg.imageDataUrl;
                    img.alt = 'Birthday photo';
                    img.loading = 'lazy';
                    card.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'card-image-placeholder';
                    placeholder.innerHTML = `<i class="fas fa-camera"></i> 📸 attach photo`;
                    card.appendChild(placeholder);
                }

                // message text
                const textDiv = document.createElement('div');
                textDiv.className = 'message-text';
                textDiv.textContent = msg.text || '💬 (no message)';
                card.appendChild(textDiv);

                // delete button
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                delBtn.setAttribute('aria-label', 'Delete message');
                delBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteMessage(index);
                });
                card.appendChild(delBtn);

                messagesContainer.appendChild(card);
            });
        }

        // === delete message by index ===
        function deleteMessage(index) {
            if (index >= 0 && index < messages.length) {
                messages.splice(index, 1);
                saveToStorage();
                renderMessages();
            }
        }

        // === add new message ===
        function addMessage() {
            const text = messageInput.value.trim();
            if (text === '') {
                alert('✏️ Please write a message for Dad!');
                return;
            }

            let imageDataUrl = null;
            const file = imageInput.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    pushMessage(text, dataUrl);
                };
                reader.onerror = function() {
                    alert('⚠️ Could not read image. Try another file.');
                };
                reader.readAsDataURL(file);
            } else {
                // no image, or file not image
                pushMessage(text, null);
            }
        }

        function pushMessage(text, imageDataUrl) {
            // if imageDataUrl is null or undefined, store null
            const newMsg = {
                text: text,
                imageDataUrl: imageDataUrl || null,
            };
            messages.push(newMsg);
            saveToStorage();
            renderMessages();

            // clear inputs (keep image input but reset)
            messageInput.value = '';
            imageInput.value = '';
            // focus back to message
            messageInput.focus();
        }

        // === event listeners ===
        addBtn.addEventListener('click', addMessage);

        // allow enter key (but not shift+enter) to submit? we use button only to avoid accidental submits
        // but we can also catch ctrl+enter if needed, but we keep it simple.

        // additional: press Enter in textarea? we use button.
        // but we add a nice touch: ctrl+enter in textarea triggers add
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                addMessage();
            }
        });

        // === init ===
        loadFromStorage();
        renderMessages();

        // extra: if there is any image loaded and user wants to clear, we keep it simple.
        console.log('🎉 Happy Birthday Dad! 🎂');
    })();
</script>
</body>
</html>
