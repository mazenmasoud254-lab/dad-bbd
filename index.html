<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🎂 Dad's Birthday Board</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* confetti overlay (tiny dots) */
        body::before {
            content: "🎉🎊🎈🎁🎂🎈🎊🎉🎁🎂🎈🎊🎉🎁🎂🎈🎊🎉🎁🎂🎈🎊🎉🎁🎂";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 2.2rem;
            letter-spacing: 20px;
            word-break: break-all;
            opacity: 0.09;
            pointer-events: none;
            overflow: hidden;
            white-space: pre-wrap;
            line-height: 4rem;
            z-index: 0;
        }

        .board-wrapper {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 241, 184, 0.25);
            backdrop-filter: blur(3px);
            border-radius: 90px 90px 40px 40px;
            padding: 2rem 1.8rem 2.8rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.3), inset 0 0 0 6px #fff3c9, inset 0 0 0 12px #fad47a;
            position: relative;
            z-index: 2;
        }

        /* header */
        .birthday-header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .birthday-header h1 {
            font-size: 4rem;
            font-weight: 800;
            color: #93291e;
            text-shadow: 6px 6px 0 #ffd966, 10px 10px 0 rgba(0, 0, 0, 0.15);
            letter-spacing: 2px;
            display: inline-block;
            background: rgba(255, 255, 240, 0.5);
            padding: 0.2rem 2.8rem;
            border-radius: 120px;
            backdrop-filter: blur(2px);
            box-shadow: 0 8px 0 #b34d2e;
        }

        .birthday-header h1 i {
            color: #f7b731;
            margin: 0 6px;
        }

        .subhead {
            font-size: 1.5rem;
            background: #fef7e0;
            display: inline-block;
            padding: 0.3rem 2.8rem;
            border-radius: 60px;
            color: #5d3a1a;
            font-weight: 600;
            margin-top: 12px;
            box-shadow: 0 6px 0 #b38b40;
            border: 2px solid #f7d675;
        }

        /* add-box (form) */
        .add-box {
            background: linear-gradient(145deg, #fff6df, #ffefc9);
            border-radius: 70px 70px 40px 40px;
            padding: 1.8rem 2rem 2rem;
            margin-bottom: 3.2rem;
            box-shadow: 0 18px 30px -6px #a57d3a, 0 0 0 6px #ffd966, 0 0 0 12px #fef3cf;
            transition: 0.2s;
            border: 2px solid #f1c40f;
        }

        .add-box:hover {
            box-shadow: 0 22px 40px -6px #7a5d29, 0 0 0 6px #f1c40f, 0 0 0 14px #fcf1cf;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .input-row label {
            font-weight: 700;
            color: #492e0e;
            font-size: 1.2rem;
            min-width: 80px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-row textarea,
        .input-row input[type="file"] {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: 3px solid #f1b82d;
            border-radius: 60px;
            background: #fffcf0;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .input-row textarea {
            border-radius: 30px;
            resize: vertical;
            min-height: 70px;
        }

        .input-row textarea:focus,
        .input-row input[type="file"]:focus {
            border-color: #b7950b;
            background: #fffffa;
            box-shadow: 0 0 0 6px #f9e79f;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            background: #fcf3db;
            padding: 0.3rem 1rem 0.3rem 1.8rem;
            border-radius: 60px;
            border: 3px dashed #c9a84b;
            flex: 1;
        }

        .file-upload-wrapper i {
            font-size: 1.6rem;
            color: #a67c2b;
        }

        .file-upload-wrapper input[type="file"] {
            border: none;
            padding: 0.4rem 0;
            background: transparent;
            flex: 1;
            font-size: 0.95rem;
            box-shadow: none;
        }

        .file-upload-wrapper input[type="file"]::file-selector-button {
            background: #f1c40f;
            border: none;
            padding: 0.4rem 1.6rem;
            border-radius: 60px;
            font-weight: 700;
            color: #2c1f0c;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 0 #b38b2a;
        }

        .file-upload-wrapper input[type="file"]::file-selector-button:hover {
            background: #d4ac0d;
            transform: scale(0.96);
        }

        .action-btn {
            background: #e67e22;
            border: none;
            color: #1f1406;
            font-weight: 800;
            font-size: 1.7rem;
            padding: 0.9rem 2.2rem;
            border-radius: 80px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 10px 0 #a45f1a, 0 8px 20px rgba(0, 0, 0, 0.25);
            transition: all 0.07s ease;
            width: 100%;
            letter-spacing: 2px;
            background: linear-gradient(145deg, #f7b731, #e67e22);
        }

        .action-btn:active {
            transform: translateY(7px);
            box-shadow: 0 3px 0 #7a4a12;
        }

        .action-btn i {
            font-size: 2rem;
        }

        /* BOARD: grid of boxes */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem 1.8rem;
            margin-top: 0.8rem;
        }

        /* each box = a card */
        .birthday-box {
            background: #fff9ec;
            border-radius: 50px 20px 50px 20px;
            padding: 1.6rem 1.2rem 1.2rem;
            box-shadow: 0 20px 30px -8px #7a5d2b, 0 0 0 5px #f7dc6f, 0 0 0 10px #fef9e7;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            transform: rotate(0.6deg);
            position: relative;
            border: 2px solid #f7d44a;
        }

        .birthday-box:nth-child(even) {
            transform: rotate(-0.8deg);
        }

        .birthday-box:hover {
            transform: scale(1.02) rotate(0deg);
            box-shadow: 0 28px 45px -6px #a67c2b, 0 0 0 7px #f1c40f, 0 0 0 14px #fff6d0;
            z-index: 5;
        }

        /* image inside box */
        .box-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 40px 10px 40px 10px;
            border: 8px solid #ffe28c;
            background: #f7e3b6;
            margin-bottom: 1rem;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
            transition: 0.15s;
        }

        .box-image-placeholder {
            width: 100%;
            aspect-ratio: 4/3;
            background: repeating-linear-gradient(45deg, #f7dcb0, #f7dcb0 12px, #faeac8 12px, #faeac8 24px);
            border-radius: 40px 10px 40px 10px;
            border: 8px dashed #dbb15d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7a5d2b;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
            padding: 1rem;
        }

        .box-image-placeholder i {
            font-size: 3rem;
            margin-right: 10px;
            color: #b8862c;
        }

        .box-message {
            font-size: 1.25rem;
            background: #fdf3d6;
            padding: 0.8rem 1.2rem;
            border-radius: 60px 20px 60px 20px;
            width: 100%;
            word-break: break-word;
            color: #3d2b0f;
            box-shadow: inset 0 2px 10px rgba(93, 61, 18, 0.08);
            border: 3px solid #f3d37c;
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-align: center;
        }

        .box-actions {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-top: 0.2rem;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #b34141;
            font-size: 1.6rem;
            cursor: pointer;
            transition: 0.15s;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            background: #ffebd6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 2px solid #f7c9a0;
        }

        .delete-btn:hover {
            background: #f7c0b0;
            color: #8f1f1f;
            transform: scale(0.9);
        }

        .empty-board {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2.4rem;
            color: #4e3a1a;
            background: rgba(255, 241, 179, 0.6);
            padding: 3rem 1.5rem;
            border-radius: 120px;
            backdrop-filter: blur(4px);
            font-weight: 700;
            border: 6px dashed #e6b422;
        }

        .empty-board i {
            margin-right: 16px;
            color: #c9921a;
        }

        /* responsive */
        @media (max-width: 600px) {
            .birthday-header h1 {
                font-size: 2.6rem;
                padding: 0.2rem 1rem;
            }
            .board-wrapper {
                padding: 1rem 0.8rem;
            }
            .add-box {
                padding: 1.5rem 1rem;
            }
            .input-row {
                flex-direction: column;
                align-items: stretch;
            }
            .file-upload-wrapper {
                flex-wrap: wrap;
            }
        }

        /* extra birthday sparkle */
        .sparkle {
            position: absolute;
            pointer-events: none;
            font-size: 2rem;
            opacity: 0.15;
        }
    </style>
</head>
<body>

<div class="board-wrapper">
    <!-- header -->
    <div class="birthday-header">
        <h1><i class="fas fa-crown"></i> Dad's Birthday <i class="fas fa-birthday-cake"></i></h1>
        <div class="subhead"><i class="fas fa-heart" style="color:#c0392b;"></i>  add a box with photo & message  <i class="fas fa-camera-retro"></i></div>
    </div>

    <!-- add box -->
    <div class="add-box">
        <div class="input-row">
            <label for="messageInput"><i class="fas fa-pencil-alt"></i> Message</label>
            <textarea id="messageInput" placeholder="Write a special birthday wish for Dad..."></textarea>
        </div>
        <div class="input-row">
            <label for="imageInput"><i class="fas fa-image"></i> Photo</label>
            <div class="file-upload-wrapper">
                <i class="fas fa-cloud-upload-alt"></i>
                <input type="file" id="imageInput" accept="image/*" />
            </div>
        </div>
        <button class="action-btn" id="addMessageBtn"><i class="fas fa-gift"></i> Add Birthday Box</button>
        <div style="margin-top: 0.5rem; text-align: right; font-size: 0.9rem; color: #6b4f1a;">
            <i class="fas fa-info-circle"></i> Press Ctrl+Enter to add
        </div>
    </div>

    <!-- the board grid -->
    <div id="boardGrid" class="board-grid">
        <!-- empty state will appear here -->
    </div>
</div>

<script>
    (function() {
        // DOM elements
        const boardGrid = document.getElementById('boardGrid');
        const messageInput = document.getElementById('messageInput');
        const imageInput = document.getElementById('imageInput');
        const addBtn = document.getElementById('addMessageBtn');

        // ----- storage -----
        let boxes = [];

        function loadFromStorage() {
            try {
                const stored = localStorage.getItem('dadBirthdayBoxes');
                if (stored) {
                    boxes = JSON.parse(stored);
                } else {
                    boxes = [];
                }
            } catch (e) {
                boxes = [];
            }
            // clean
            boxes = boxes.filter(b => b && typeof b.text === 'string');
        }

        function saveToStorage() {
            localStorage.setItem('dadBirthdayBoxes', JSON.stringify(boxes));
        }

        // ----- render board -----
        function renderBoard() {
            if (!boardGrid) return;
            boardGrid.innerHTML = '';

            if (boxes.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-board';
                emptyDiv.innerHTML = `<i class="fas fa-champagne-glasses"></i> No birthday boxes yet — add one above! 🎁`;
                boardGrid.appendChild(emptyDiv);
                return;
            }

            // loop and create each box
            boxes.forEach((box, index) => {
                const card = document.createElement('div');
                card.className = 'birthday-box';

                // image part
                if (box.imageDataUrl && box.imageDataUrl.trim() !== '') {
                    const img = document.createElement('img');
                    img.className = 'box-image';
                    img.src = box.imageDataUrl;
                    img.alt = 'Birthday photo';
                    img.loading = 'lazy';
                    card.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'box-image-placeholder';
                    placeholder.innerHTML = `<i class="fas fa-camera"></i> attach photo`;
                    card.appendChild(placeholder);
                }

                // message
                const msgDiv = document.createElement('div');
                msgDiv.className = 'box-message';
                msgDiv.textContent = box.text || '💬 Happy Birthday!';
                card.appendChild(msgDiv);

                // delete button
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'box-actions';
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                delBtn.setAttribute('aria-label', 'Delete box');
                delBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteBox(index);
                });
                actionsDiv.appendChild(delBtn);
                card.appendChild(actionsDiv);

                boardGrid.appendChild(card);
            });
        }

        // ----- delete box -----
        function deleteBox(index) {
            if (index >= 0 && index < boxes.length) {
                boxes.splice(index, 1);
                saveToStorage();
                renderBoard();
            }
        }

        // ----- add new box (message + image) -----
        function addNewBox() {
            const text = messageInput.value.trim();
            if (text === '') {
                alert('✏️ Please write a birthday message for Dad!');
                return;
            }

            const file = imageInput.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    pushBox(text, dataUrl);
                };
                reader.onerror = function() {
                    alert('⚠️ Could not read image. Please try another file.');
                };
                reader.readAsDataURL(file);
            } else {
                // no image or invalid file -> store with null image
                pushBox(text, null);
            }
        }

        function pushBox(text, imageDataUrl) {
            const newBox = {
                text: text,
                imageDataUrl: imageDataUrl || null,
            };
            boxes.push(newBox);
            saveToStorage();
            renderBoard();

            // reset inputs
            messageInput.value = '';
            imageInput.value = '';
            messageInput.focus();
        }

        // ----- event binding -----
        addBtn.addEventListener('click', addNewBox);

        // Ctrl+Enter in textarea
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                addNewBox();
            }
        });

        // ----- init -----
        loadFromStorage();
        renderBoard();

        console.log('🎂 Happy Birthday, Dad! 🎈');
    })();
</script>
</body>
</html>
